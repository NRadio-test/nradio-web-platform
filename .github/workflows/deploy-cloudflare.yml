name: Deploy NRadio site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "Web/**"
      - "knowledge-base/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: nradio-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync and validate knowledge data
        run: |
          node Web/scripts/sync-knowledge.mjs
          node Web/scripts/check.mjs
          node Web/scripts/prepare-deploy.mjs

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: Web
          command: pages deploy frontend/public --project-name=nradio-web --branch=main
